[project]
name = "samva"
version = "0.1.0"
description = "Traffic Sign Recognition"
readme = "README.rst"
authors = [
    { name = "Ezechiel Touré", email = "ezechieltoure20@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "tensorflow>=2.15.0",
    "opencv-python>=4.9.0",
    "scikit-learn>=1.4.0",
    "numpy>=1.26.0",
]

[project.scripts]
samva = "samva.run:main"

[build-system]
requires = ["uv_build>=0.12.12,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "coverage>=7.16.2",
    "mypy>=2.4.0",
    "nox[uv]>=2026.8.17",
    "pytest>=9.1.1",
]